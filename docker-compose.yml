services:

  postgres:
    image: postgres:17
    container_name: pdf-approval-postgres
    environment:
      POSTGRES_DB: pdf_approval_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pdf-approval-postgres-data:/var/lib/postgresql/data
    networks:
      - pdf-approval-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-approval-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pdf_approval_system
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    networks:
      - pdf-approval-network

  frontend:
    image: pdf-approval-frontend:latest
    container_name: pdf-approval-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - pdf-approval-network

networks:
  pdf-approval-network:
    driver: bridge

volumes:
  pdf-approval-postgres-data:
    external: true